name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate bundled app icon asset
        run: |
          java scripts/DecodeBase64.java assets/time-off-tracker-icon.png.b64 /tmp/time-off-tracker-icon.png
          test -s /tmp/time-off-tracker-icon.png

      - name: Build and run tests
        run: mvn -B clean verify
